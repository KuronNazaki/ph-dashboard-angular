<div class="h-screen w-full flex flex-col justify-between">
  <nav
    class="shrink-0 relative flex justify-between w-full h-16 bg-sidebar shadow-xs border-b border-border px-5"
  >
    <div class="flex gap-2 items-center">
      <div class="size-9">
        <img src="/ph.svg" alt="PH" />
      </div>
      <div class="flex flex-col">
        <h1 class="text-lg font-black text-foreground leading-tight">PhDA</h1>
        <p class="text-muted-foreground text-xs font-mono leading-tight">An Angular application</p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      @for (navigation of navigations(); track navigation.path) {
        <a
          z-button
          [routerLink]="['/', navigation.path]"
          routerLinkActive
          #rla="routerLinkActive"
          [zType]="rla.isActive ? 'default' : 'outline'"
          queryParamsHandling="replace"
        >
          {{ navigation.label }}
        </a>
      }
    </div>
  </nav>

  <main class="grow h-10 relative w-full flex flex-col gap-5 py-10 px-20">
    <router-outlet />
  </main>

  <footer
    class="shrink-0 flex items-center px-5 relative w-full h-10 bg-sidebar border-t border-border"
  >
    <div class="font-mono text-xs text-muted-foreground">Created by PH. 2026 👋</div>
  </footer>
</div>
